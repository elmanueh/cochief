name: CI Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release -p:GenerateClashOfClansClient=true

      - name: Test application
        run: dotnet test tests/Cochief.Application.Tests/Cochief.Application.Tests.csproj --configuration Release --no-build
