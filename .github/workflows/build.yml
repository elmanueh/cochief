name: CI Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release
